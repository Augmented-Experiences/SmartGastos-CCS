name: Build SmartGastos Desktop Installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Qué instaladores generar
        type: choice
        options:
          - macos
          - windows
          - linux
          - all
        default: macos
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    if: >
      github.event_name != 'workflow_dispatch'
      || github.event.inputs.platform == 'all'
      || github.event.inputs.platform == matrix.platform
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Tauri dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build backend sidecar (Unix)
        if: runner.os != 'Windows'
        run: bash desktop/scripts/build-backend.sh

      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File desktop/scripts/build-backend.ps1

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm install

      - name: Generate Tauri icons
        working-directory: desktop
        run: npm run icon

      - name: Build Tauri app
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: smartgastos-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
