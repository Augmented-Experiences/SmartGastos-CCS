name: Build SmartGastos Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build backend sidecar
        run: bash desktop/scripts/build-backend.sh

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm install

      - name: Generate Tauri icons
        working-directory: desktop
        run: npm run icon

      - name: Build Tauri app
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: smartgastos-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 14
